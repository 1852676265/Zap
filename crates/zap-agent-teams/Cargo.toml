[package]
name = "zap-agent-teams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zap-auth = { path = "../zap-auth" }
zap-capabilities = { path = "../zap-capabilities" }
zap-coding = { path = "../zap-coding" }
zap-config = { path = "../zap-config" }
zap-kernel = { path = "../zap-kernel" }
zap-neural-memory = { path = "../zap-neural-memory" }

async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
